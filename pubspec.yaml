name: gts
description: "A new Flutter project. The test app"

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.0


dependencies:
  flutter:
    sdk: flutter

  flutter_svg: ^2.0.10

  cupertino_icons: ^1.0.8
  #https://pub.dev/packages/flutter_screenutil/changelog
  flutter_screenutil: ^5.9.3
  #https://pub.dev/packages/go_router
  go_router: ^17.0.1
  #https://pub.dev/packages/easy_localization
  easy_localization: ^3.0.8
  #https://pub.dev/packages/bloc
  bloc: ^9.2.0


dev_dependencies:
  flutter_test:
    sdk: flutter


  flutter_lints: ^5.0.0


flutter:


  uses-material-design: true


  assets:
      - assets/image/icons/flights/
      - assets/image/icons/button/
      - assets/image/background/
      - assets/image/logo/
      - assets/translations/


  fonts:
    - family: Mulish
      fonts:
        - asset: assets/fonts/mulish/Mulish-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/mulish/Mulish-Light.ttf
          weight: 300
        - asset: assets/fonts/mulish/Mulish-Regular.ttf
          weight: 400
        - asset: assets/fonts/mulish/Mulish-Medium.ttf
          weight: 500
        - asset: assets/fonts/mulish/Mulish-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/mulish/Mulish-Bold.ttf
          weight: 700
        - asset: assets/fonts/mulish/Mulish-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/mulish/Mulish-Black.ttf
          weight: 900
